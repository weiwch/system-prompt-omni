name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or repair (for example, v0.3.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish npm package and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Validate release version
        id: package
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${package_version}." >&2
            exit 1
          fi

          if [[ "${package_version}" == *-* ]]; then
            npm_tag=next
            prerelease=true
          else
            npm_tag=latest
            prerelease=false
          fi

          echo "name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "npm-tag=${npm_tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test

      - name: Inspect package
        id: pack
        shell: bash
        run: |
          manifest="${RUNNER_TEMP}/package-manifest.json"
          npm pack --dry-run --json > "${manifest}"
          shasum="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))[0].shasum" "${manifest}")"
          echo "shasum=${shasum}" >> "$GITHUB_OUTPUT"

      - name: Check npm registry
        id: registry
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          LOCAL_SHASUM: ${{ steps.pack.outputs.shasum }}
        run: |
          package_spec="${PACKAGE_NAME}@${PACKAGE_VERSION}"
          error_log="${RUNNER_TEMP}/npm-view-error.log"

          if metadata="$(npm view "${package_spec}" version dist.shasum --json 2>"${error_log}")"; then
            published_version="$(node -e 'const value=JSON.parse(process.argv[1]); console.log(value.version)' "${metadata}")"
            published_shasum="$(node -e 'const value=JSON.parse(process.argv[1]); console.log(value["dist.shasum"])' "${metadata}")"
          else
            status=$?
            error_code="$(node -e 'try { console.log(JSON.parse(process.argv[1]).error.code) } catch {}' "${metadata}")"
            if [[ "${error_code}" == "E404" ]]; then
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            cat "${error_log}" >&2
            exit "${status}"
          fi

          if [[ "${published_version}" != "${PACKAGE_VERSION}" || "${published_shasum}" != "${LOCAL_SHASUM}" ]]; then
            echo "npm already contains ${package_spec}, but its tarball does not match this tag." >&2
            exit 1
          fi

          echo "npm already contains the identical ${package_spec}; skipping publish."
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish --access public --tag "${{ steps.package.outputs.npm-tag }}"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.package.outputs.prerelease }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists; nothing to do."
            exit 0
          fi

          args=("${RELEASE_TAG}" --verify-tag --generate-notes --title "${RELEASE_TAG}")
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
